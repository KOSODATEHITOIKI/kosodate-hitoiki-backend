name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-config:
    name: Docs and config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check Markdown and configuration
        run: npm run check

  db-tests:
    name: Database (migrations and RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Start local Supabase
        run: npm run supabase:start
      - name: Run pgTAP database tests
        run: npx supabase test db
      - name: Run concurrency tests
        run: npm run test:concurrency
      # Denoの実行ファイルはnpmのpostinstallで取得する（上のnpm ciは--ignore-scripts）。
      - name: Install Deno binary
        run: npm rebuild deno
      - name: Run Edge Functions integration tests
        run: npm run test:functions-integration
      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop

  functions:
    name: Functions (types and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      # Denoの実行ファイルはnpmのpostinstallで取得するため、ここだけ --ignore-scripts を付けない。
      - name: Install dependencies
        run: npm ci
      - name: Format, lint and type check
        run: npm run functions:check
      - name: Run Deno tests
        run: npm run functions:test
