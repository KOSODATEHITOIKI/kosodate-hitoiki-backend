name: Deploy (dev)

# develop へのマージで、開発用Supabaseプロジェクトへマイグレーションを反映する。
# 接続情報は GitHub Environment「development」の Secrets / Variables でのみ管理する。

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate dev project
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/develop'
    environment: development
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # 同じコミットのCIが成功するまで待つ。失敗・タイムアウト時はデプロイしない。
          for i in $(seq 1 60); do
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
            echo "CI: $run"
            case "$run" in
              "completed success") exit 0 ;;
              "completed "*) echo "CIが成功していないためデプロイしません"; exit 1 ;;
            esac
            sleep 15
          done
          echo "CIの完了を待ちきれませんでした"; exit 1
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Link dev project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply migrations
        run: npx supabase db push
      # 送信前チェックのAPIキー。未登録の環境ではFunctionsは保存をブロックする（503、安全側）。
      - name: Set function secrets
        if: env.OPENAI_API_KEY != ''
        run: npx supabase secrets set OPENAI_API_KEY="$OPENAI_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy Edge Functions
        run: npx supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
