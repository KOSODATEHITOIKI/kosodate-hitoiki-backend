name: Backup

# 毎日、データベースのバックアップを取り、**使い捨ての環境へ復元して検証**してから、暗号化して S3 に保管する。
# 復元できないバックアップは成功にしない（失敗するとGitHubからメールが届く）。
# 手順・鍵の管理・復元は docs/運用手順.md。
#
# 有効にするのは、リポジトリの Variables で BACKUP_DEV_ENABLED / BACKUP_PROD_ENABLED を "true" にしたときだけ。
# 注意：スケジュール実行は、デフォルトブランチ（main）のこのファイルで動く（初回リリースまでは手動実行のみ）。

on:
  schedule:
    - cron: "17 17 * * *" # 毎日 02:17（日本時間）
  workflow_dispatch:
    inputs:
      target:
        description: "対象の環境"
        type: choice
        options: [all, development, production]
        default: all

permissions:
  contents: read

concurrency:
  group: backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # どの環境を対象にするかを決める（Variablesで有効にした環境だけ）。ジョブの if では matrix が使えないため、
  # ここで組み立てた結果を、次のジョブの matrix に渡す。
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - id: m
        env:
          DEV_ENABLED: ${{ vars.BACKUP_DEV_ENABLED }}
          PROD_ENABLED: ${{ vars.BACKUP_PROD_ENABLED }}
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
        run: |
          set -euo pipefail
          items=()
          if [ "$DEV_ENABLED" = "true" ] && { [ "$TARGET" = "all" ] || [ "$TARGET" = "development" ]; }; then
            items+=('{"target":"development","environment":"backup-development","ref":"develop"}')
          fi
          if [ "$PROD_ENABLED" = "true" ] && { [ "$TARGET" = "all" ] || [ "$TARGET" = "production" ]; }; then
            items+=('{"target":"production","environment":"backup-production","ref":"main"}')
          fi
          json=$(IFS=,; echo "${items[*]:-}")
          echo "matrix={\"include\":[$json]}" >> "$GITHUB_OUTPUT"
          echo "count=${#items[@]}" >> "$GITHUB_OUTPUT"
          echo "対象の環境：${#items[@]}件"

  backup:
    name: Backup (${{ matrix.target }})
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write # AWSへ一時的な権限で接続する（OIDC）。長期のアクセスキーは使わない
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout (schema = the environment's branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # 復元の検証先：使い捨てのローカルSupabase。マイグレーションは、対象の環境と同じブランチのもの。
      - name: Start disposable Supabase (restore target)
        run: npm run supabase:start
      - name: Take backup (read-only connection)
        env:
          SRC_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          OUT: ${{ runner.temp }}/backup
        run: bash scripts/ops/backup.sh
      - name: Verify the backup restores (disposable database)
        env:
          DST_DB_CONTAINER: supabase_db_kosodate-hitoiki-backend
        run: bash scripts/ops/verify-backup.sh "${{ runner.temp }}/backup"
      - name: Encrypt (age; only the owner's public keys are here)
        env:
          RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS }}
        run: |
          set -euo pipefail
          [ -n "$RECIPIENTS" ] || { echo "BACKUP_AGE_RECIPIENTS（暗号化の公開鍵）が未設定です" >&2; exit 1; }
          sudo apt-get install -y --no-install-recommends age >/dev/null
          args=()
          for r in $RECIPIENTS; do args+=(-r "$r"); done
          tar -cf - -C "${{ runner.temp }}/backup" dump.pgdump manifest.json | age "${args[@]}" > "${{ runner.temp }}/backup.tar.age"
          # 暗号化前のファイルを、このあと残さない
          rm -rf "${{ runner.temp }}/backup"
          echo "暗号化したバックアップ：$(wc -c < "${{ runner.temp }}/backup.tar.age" | tr -d ' ')バイト"
      - name: Configure AWS credentials (OIDC, temporary)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_BACKUP_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Upload to S3 and verify the size
        env:
          BUCKET: ${{ vars.BACKUP_BUCKET }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          key="backups/${TARGET}/$(date -u +%Y/%m/%d)/backup-${stamp}.tar.age"
          aws s3 cp "${{ runner.temp }}/backup.tar.age" "s3://${BUCKET}/${key}" --no-progress
          local_size=$(wc -c < "${{ runner.temp }}/backup.tar.age" | tr -d ' ')
          remote_size=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$key" --query 'Contents[0].Size' --output text)
          [ "$local_size" = "$remote_size" ] || { echo "保管したサイズが一致しません（${local_size} / ${remote_size}）" >&2; exit 1; }
          echo "保管しました：s3://${BUCKET}/${key}（${remote_size}バイト）"
      - name: Report success to the dead-man's switch (optional)
        if: ${{ success() }}
        env:
          PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          # バックアップの「定期実行そのものが止まった」ことも検知するため、成功のたびに外部の見張りへ知らせる（任意）
          if [ -n "${PING_URL:-}" ]; then curl -fsS -m 10 --retry 3 "$PING_URL" >/dev/null && echo "見張りへ通知しました"; fi
      - name: Stop disposable Supabase
        if: ${{ always() }}
        run: npm run supabase:stop
